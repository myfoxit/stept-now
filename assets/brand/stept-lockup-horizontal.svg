    <rect x="3" y="3.5" width="15" height="7" rx="2.9" fill="#14161A"/>
    <rect x="6" y="13.5" width="15" height="7" rx="2.9" fill="#4F46E5"/>
  </g>
  <text x="40" y="30" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="29" font-weight="500" letter-spacing="-0.9" fill="#14161A">Stept</text>
</svg>
