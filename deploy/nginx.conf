# Serves the dashboard SPA and the widget bundle. Caddy terminates TLS and sends
# every /api, /ws, /portal and /extension-assets path to the API, so anything
# arriving here is a static asset or a client-side route.
#
# Security headers are repeated in every location rather than declared once at
# server level: nginx only inherits add_header from an outer level when the
# current level declares *none* of its own, and every location here sets at
# least a Cache-Control. Declaring them once at the top would silently drop them
# from all of them — which is how the dashboard (an app route, so `location /`)
# ended up with no framing policy at all while the API had X-Frame-Options: DENY.
#
# The dashboard now ships a full Content-Security-Policy (the app document is
# the one place a stored-XSS payload would execute). Notes on each directive:
#   script-src 'self'      Vite emits only external hashed modules, and the one
#                          inline bootstrap (theme flash) was moved to
#                          /theme-init.js — so no 'unsafe-inline' is needed.
#   style-src  'unsafe-inline'  Radix UI sets inline styles for positioning
#                          (popovers/dialogs); style-based injection is far lower
#                          risk than script, so this is the deliberate exception.
#   connect-src 'self'     same-origin REST + wss (Caddy terminates TLS and
#                          proxies /ws to the API on the same host).
#   img-src data: https:   avatars and provider photos come from arbitrary https
#                          hosts; data: covers inline SVG/canvas.
#   frame-ancestors 'none' the framing ban that was the originally-exploitable
#                          gap; object-src none + base-uri self close the rest.
# The full policy is repeated verbatim in each HTML location below (nginx drops
# every inherited add_header the moment a location declares one of its own).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy already logs every request; a second copy is noise.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml application/wasm;

    # Vite emits content-hashed filenames, so assets are safe to pin forever…
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # …but the widget loader is referenced by a stable URL from customer sites,
    # so it must be revalidated or a fix never reaches them.
    # Deliberately NOT framing-restricted: the widget renders as an iframe inside
    # customer sites, so a DENY here would break every embed. Mirrors
    # FRAMEABLE_PREFIXES in backend/app/main.py.
    location /widget-assets/ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html must never be cached, or a deploy leaves clients pointed at
    # asset URLs that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Client-side routing: unknown paths are app routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
