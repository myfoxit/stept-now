# Serves the dashboard SPA and the widget bundle. Caddy terminates TLS and sends
# every /api, /ws, /portal and /extension-assets path to the API, so anything
# arriving here is a static asset or a client-side route.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy already logs every request; a second copy is noise.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml application/wasm;

    # Vite emits content-hashed filenames, so assets are safe to pin forever…
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # …but the widget loader is referenced by a stable URL from customer sites,
    # so it must be revalidated or a fix never reaches them.
    location /widget-assets/ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html must never be cached, or a deploy leaves clients pointed at
    # asset URLs that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are app routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff";
    }
}
