# Stept — standalone self-host stack.
#
# The whole product on one box behind one domain: API + background workers, the
# dashboard/widget bundle, Postgres (pgvector), Redis and Caddy for TLS. No
# marketing landing, no docs site, no external networks — for the multi-site
# production layout this derives from, see docker-compose.prod.yml.
#
# From a source checkout (repo root):
#
#   DOMAIN=stept.example.com ACME_EMAIL=you@example.com \
#   POSTGRES_PASSWORD=… STEPT_SECRET_KEY=… \
#   docker compose -f deploy/docker-compose.standalone.yml up -d --build
#
# Or put the variables in deploy/.env (compose reads it automatically). Required:
#
#   DOMAIN              public hostname; the app is served at https://$DOMAIN
#   ACME_EMAIL          Let's Encrypt account email
#   POSTGRES_PASSWORD   database password
#   STEPT_SECRET_KEY    ≥32 chars — python -c 'import secrets; print(secrets.token_urlsafe(48))'
#
# Optional: API_IMAGE / WEB_IMAGE switch from building locally to prebuilt
# images (e.g. ghcr.io/myfoxit/stept-now/{api,web}:<sha>); the STEPT_SMTP_* block
# enables outbound email (unset ⇒ emails are logged to the api container's
# stdout instead of sent).
#
# Process split, same as production and for the same reason:
#   api        N uvicorn workers, scheduler OFF
#   worker     ARQ, drains the Redis task queue (AI runs, webhook delivery, RAG)
#   scheduler  exactly ONE loop for periodic jobs — running it inside each api
#              worker would duplicate every campaign send and SLA breach event
#   web        nginx: dashboard SPA + widget bundle
#   caddy      sole public entry point, terminates TLS

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stept}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-stept}
      # Deterministic collation so index ordering does not depend on the host.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stept} -d ${POSTGRES_DB:-stept}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: [no-new-privileges:true]
    networks: [stept]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queue jobs must survive a restart, so persist rather than run cache-only.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
    networks: [stept]

  api:
    image: ${API_IMAGE:-stept/api:standalone}
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      STEPT_ENV: prod
      STEPT_SECRET_KEY: ${STEPT_SECRET_KEY:?STEPT_SECRET_KEY is required}
      STEPT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stept}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stept}
      STEPT_REDIS_URL: redis://redis:6379/0
      # One scheduler process owns periodic work — see the scheduler service.
      STEPT_SCHEDULER_ENABLED: 'false'
      # Everything lives on the one domain, so both URLs point at it. env=prod
      # refuses non-https base URLs, which is fine: Caddy terminates TLS.
      STEPT_PUBLIC_BASE_URL: https://${DOMAIN:?DOMAIN is required}
      STEPT_APP_BASE_URL: https://${DOMAIN}
      # Proxies that append to X-Forwarded-For before the app sees it. Just
      # Caddy here — raise it if you front this stack with another proxy/CDN,
      # or the public rate limits key on the wrong address.
      STEPT_TRUSTED_PROXY_HOPS: ${STEPT_TRUSTED_PROXY_HOPS:-1}
      STEPT_WEB_CONCURRENCY: ${STEPT_WEB_CONCURRENCY:-4}
      # Outbound email — optional; unset ⇒ emails are logged, not sent.
      STEPT_SMTP_HOST: ${STEPT_SMTP_HOST:-}
      STEPT_SMTP_PORT: ${STEPT_SMTP_PORT:-25}
      STEPT_SMTP_USER: ${STEPT_SMTP_USER:-}
      STEPT_SMTP_PASSWORD: ${STEPT_SMTP_PASSWORD:-}
      STEPT_SMTP_TLS: ${STEPT_SMTP_TLS:-false}
      STEPT_EMAIL_FROM: ${STEPT_EMAIL_FROM:-Stept <no-reply@stept.local>}
    expose: ['8600']
    volumes:
      - uploads:/data/uploads
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [stept]

  worker:
    image: ${API_IMAGE:-stept/api:standalone}
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_started}
    command: ['arq', 'app.workers.arq.WorkerSettings']
    environment:
      STEPT_ENV: prod
      STEPT_SECRET_KEY: ${STEPT_SECRET_KEY}
      STEPT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stept}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stept}
      STEPT_REDIS_URL: redis://redis:6379/0
      STEPT_SCHEDULER_ENABLED: 'false'
      STEPT_PUBLIC_BASE_URL: https://${DOMAIN}
      STEPT_APP_BASE_URL: https://${DOMAIN}
      # The worker sends the emails the api/scheduler enqueue.
      STEPT_SMTP_HOST: ${STEPT_SMTP_HOST:-}
      STEPT_SMTP_PORT: ${STEPT_SMTP_PORT:-25}
      STEPT_SMTP_USER: ${STEPT_SMTP_USER:-}
      STEPT_SMTP_PASSWORD: ${STEPT_SMTP_PASSWORD:-}
      STEPT_SMTP_TLS: ${STEPT_SMTP_TLS:-false}
      STEPT_EMAIL_FROM: ${STEPT_EMAIL_FROM:-Stept <no-reply@stept.local>}
    # The image's healthcheck curls the API port; this process serves no HTTP, so
    # inheriting it would mark a healthy worker unhealthy forever. What a check
    # can still add is "arq can still reach the queue it drains".
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import socket,sys; s=socket.create_connection((''redis'',6379),3); s.close()"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # Shared with the api: ingestion reads the files an upload wrote.
      - uploads:/data/uploads
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [stept]

  scheduler:
    image: ${API_IMAGE:-stept/api:standalone}
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_started}
    command: ['python', '-m', 'app.workers.scheduler']
    environment:
      STEPT_ENV: prod
      STEPT_SECRET_KEY: ${STEPT_SECRET_KEY}
      STEPT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stept}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stept}
      STEPT_REDIS_URL: redis://redis:6379/0
      STEPT_SCHEDULER_ENABLED: 'true'
      STEPT_PUBLIC_BASE_URL: https://${DOMAIN}
      STEPT_APP_BASE_URL: https://${DOMAIN}
    # Same reasoning as the worker; the scheduler's job is to enqueue, so its
    # meaningful dependency is Redis too.
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import socket,sys; s=socket.create_connection((''redis'',6379),3); s.close()"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Never scale this past 1 — that is the whole reason it exists.
    deploy:
      replicas: 1
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [stept]

  web:
    image: ${WEB_IMAGE:-stept/web:standalone}
    build:
      # Repo root, not ../frontend: pnpm needs the workspace manifest and the
      # widget's local @stept/dom-capture dependency (same as the deploy build).
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    expose: ['80']
    security_opt: [no-new-privileges:true]
    networks: [stept]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api: {condition: service_started}
      web: {condition: service_started}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile.standalone:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    # Proves Caddy is up AND can reach the API through the network.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://api:8600/api/v1/healthz >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [stept]

networks:
  stept:

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy-data:
  caddy-config:
