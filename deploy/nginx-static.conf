# Shared nginx config for the static Astro sites (landing, docs). Caddy
# terminates TLS in front; anything arriving here is a fully static page or
# asset. Distinct from deploy/nginx.conf, which serves the dashboard SPA and
# needs client-side-routing fallback — these sites are real files on disk and a
# miss is a genuine 404.
#
# Security headers are repeated per location because nginx drops inherited
# add_header directives the moment a level declares any of its own (see the
# comment in deploy/nginx.conf for the war story).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml application/xml text/plain;

    # Astro emits content-hashed assets under /_astro/ — safe to pin forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;

    # HTML must revalidate so a deploy is visible immediately; short public
    # max-age keeps Cloudflare from hammering the origin.
    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ =404;
    }
}
