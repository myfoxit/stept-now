name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stept
          POSTGRES_PASSWORD: stept
          POSTGRES_DB: stept_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U stept"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
      - name: Type-check
        working-directory: backend
        run: uv run mypy app
      - name: Tests (SQLite + Postgres-marked)
        working-directory: backend
        env:
          STEPT_TEST_PG_URL: postgresql+asyncpg://stept:stept@localhost:54329/stept_test
        run: uv run pytest -q

  web:
    name: Web (types, tests, builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check + unit tests + build (all packages)
        run: |
          pnpm --filter @stept/frontend exec tsc --noEmit
          pnpm --filter @stept/frontend test -- --run
          pnpm --filter @stept/widget test -- --run
          pnpm -r build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cd backend && uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - name: Build widget (served by backend in e2e)
        run: pnpm --filter @stept/widget build --if-present
      - name: Install Playwright
        run: pnpm --filter @stept/e2e exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm --filter @stept/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
