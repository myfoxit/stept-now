name: Deploy

# Ships master to app.stepped.ai. Manual runs can target a specific commit or skip
# the test gate for a hotfix; a push to master always runs the full gate first.
on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip the test gate (hotfix only — you own the consequences)'
        type: boolean
        default: false

# One deploy at a time, and never cancel one mid-flight: a half-applied migration
# is far worse than a queued run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Nested under the repository path on purpose. GITHUB_TOKEN can only create a
  # GHCR package that belongs to this repo; `ghcr.io/<owner>/stept-api` is a
  # separate top-level package in the owner's namespace and the push is rejected
  # with `denied: permission_denied: write_package`. `<owner>/<repo>/<image>` is
  # the documented multi-image layout and needs no personal access token.
  API_IMAGE_NAME: ${{ github.repository }}/api
  WEB_IMAGE_NAME: ${{ github.repository }}/web
  LANDING_IMAGE_NAME: ${{ github.repository }}/landing
  DOCS_IMAGE_NAME: ${{ github.repository }}/docs

jobs:
  # The gate. Deploy depends on this, so a red test suite cannot reach the server.
  verify:
    name: Verify
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stept
          POSTGRES_PASSWORD: stept
          POSTGRES_DB: stept_test
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U stept"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: |
          cd backend && uv sync --frozen
          cd .. && pnpm install --frozen-lockfile

      - name: Lint + types
        working-directory: backend
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
          uv run mypy app

      - name: Backend tests (SQLite + Postgres-marked)
        working-directory: backend
        env:
          STEPT_TEST_PG_URL: postgresql+asyncpg://stept:stept@localhost:54329/stept_test
        run: uv run pytest -q

      # Cheap, and the only gate that catches a locale whose catalog went stale —
      # no test asserts on translation completeness.
      - name: Catalog integrity (i18n)
        run: node scripts/check-i18n.mjs

      - name: Frontend types, tests, builds
        run: |
          pnpm --filter @stept/frontend exec tsc --noEmit
          pnpm --filter @stept/frontend test -- --run
          pnpm --filter @stept/widget test -- --run
          pnpm --filter @stept/extension test -- --run
          pnpm --filter @stept/dom-capture test -- --run
          pnpm --filter @stept/js test -- --run
          pnpm --filter @stept/react test -- --run
          pnpm -r build

      - name: Migrations apply cleanly to an empty Postgres, and reverse
        working-directory: backend
        env:
          STEPT_DATABASE_URL: postgresql+asyncpg://stept:stept@localhost:54329/stept_migrate
        run: |
          # A migration that only works against the dev database is not a
          # migration. Prove up/down/up on a database created from scratch.
          PGPASSWORD=stept psql -h localhost -p 54329 -U stept -d postgres \
            -c 'DROP DATABASE IF EXISTS stept_migrate' -c 'CREATE DATABASE stept_migrate'
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  build:
    name: Build and push images
    needs: [verify]
    # `always()` plus an explicit check so a skipped gate (hotfix) still builds,
    # but a *failed* gate never does.
    if: ${{ always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled' }}
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.names.outputs.api_image }}
      web_image: ${{ steps.names.outputs.web_image }}
      landing_image: ${{ steps.names.outputs.landing_image }}
      docs_image: ${{ steps.names.outputs.docs_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: names
        run: |
          # Lowercase: GHCR rejects uppercase repository paths, and org names can
          # legitimately contain capitals.
          api="${REGISTRY}/$(echo "${API_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA}"
          web="${REGISTRY}/$(echo "${WEB_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA}"
          landing="${REGISTRY}/$(echo "${LANDING_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA}"
          docs="${REGISTRY}/$(echo "${DOCS_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA}"
          echo "api_image=${api}" >> "$GITHUB_OUTPUT"
          echo "web_image=${web}" >> "$GITHUB_OUTPUT"
          echo "landing_image=${landing}" >> "$GITHUB_OUTPUT"
          echo "docs_image=${docs}" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          # Pinned to the commit SHA, never `latest`: the server must be able to
          # say exactly which build it is running, and roll back to a known one.
          tags: ${{ steps.names.outputs.api_image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          # Repo root: pnpm needs the workspace manifest and the widget's local
          # @stept/dom-capture dependency.
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.web_image }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push landing
        uses: docker/build-push-action@v6
        with:
          # Repo root so deploy/nginx-static.conf is in context; the landing is
          # otherwise self-contained with its own lockfile.
          context: .
          file: landing/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.landing_image }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,scope=landing,mode=max

      - name: Build and push docs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs-site/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.docs_image }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max

  deploy:
    name: Deploy to production
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.stepped.ai
    steps:
      - uses: actions/checkout@v4

      - name: Open an SSH session to the host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key instead of accepting whatever answers: this step
          # hands a root shell to whoever is on the other end.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host production
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync stack definition
        run: |
          ssh production 'mkdir -p /opt/stept'
          scp deploy/docker-compose.prod.yml production:/opt/stept/docker-compose.yml
          scp deploy/Caddyfile production:/opt/stept/Caddyfile

      - name: Render /opt/stept/.env
        env:
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          LANDING_IMAGE: ${{ needs.build.outputs.landing_image }}
          DOCS_IMAGE: ${{ needs.build.outputs.docs_image }}
        run: |
          # Written with a strict umask and never echoed. Image tags change every
          # deploy; the secrets are only written if this workflow supplies them,
          # so a rotated value has to come through GitHub secrets, not by hand.
          ssh production "umask 077 && cat > /opt/stept/.env" <<EOF
          API_IMAGE=${API_IMAGE}
          WEB_IMAGE=${WEB_IMAGE}
          LANDING_IMAGE=${LANDING_IMAGE}
          DOCS_IMAGE=${DOCS_IMAGE}
          DOMAIN=${{ secrets.DEPLOY_DOMAIN }}
          APP_DOMAIN=${{ secrets.DEPLOY_APP_DOMAIN }}
          SERVER_IP=${{ secrets.DEPLOY_HOST }}
          ACME_EMAIL=${{ secrets.ACME_EMAIL }}
          STEPT_SECRET_KEY=${{ secrets.STEPT_SECRET_KEY }}
          POSTGRES_USER=stept
          POSTGRES_DB=stept
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          STEPT_PUBLIC_BASE_URL=https://${{ secrets.DEPLOY_APP_DOMAIN }}
          STEPT_APP_BASE_URL=https://${{ secrets.DEPLOY_APP_DOMAIN }}
          STEPT_WEB_CONCURRENCY=4
          STEPT_TRUSTED_PROXY_HOPS=${{ vars.STEPT_TRUSTED_PROXY_HOPS || '2' }}
          STEPT_EMAIL_FROM=Stept <no-reply@${{ secrets.DEPLOY_DOMAIN }}>
          STEPT_GITHUB_CLIENT_ID=${{ secrets.STEPT_GITHUB_CLIENT_ID }}
          STEPT_GITHUB_CLIENT_SECRET=${{ secrets.STEPT_GITHUB_CLIENT_SECRET }}
          STEPT_GOOGLE_LOGIN_CLIENT_ID=${{ secrets.STEPT_GOOGLE_LOGIN_CLIENT_ID }}
          STEPT_GOOGLE_LOGIN_CLIENT_SECRET=${{ secrets.STEPT_GOOGLE_LOGIN_CLIENT_SECRET }}
          STEPT_STRIPE_SECRET_KEY=${{ secrets.STEPT_STRIPE_SECRET_KEY }}
          STEPT_STRIPE_WEBHOOK_SECRET=${{ secrets.STEPT_STRIPE_WEBHOOK_SECRET }}
          STEPT_STRIPE_PUBLISHABLE_KEY=${{ secrets.STEPT_STRIPE_PUBLISHABLE_KEY }}
          STEPT_STRIPE_PRICE_CLOUD=${{ secrets.STEPT_STRIPE_PRICE_CLOUD }}
          STEPT_STRIPE_PRICE_BUSINESS=${{ secrets.STEPT_STRIPE_PRICE_BUSINESS }}
          EOF
          ssh production 'chmod 600 /opt/stept/.env'

      # No "save the current release" step is needed here: .env.previous is only
      # written at the very end of a *successful* deploy, so at this point it
      # still holds the last release that passed its live checks — which is
      # exactly what a rollback should target.

      - name: Authenticate the host to GHCR for this run
        run: |
          # The repo is private, so its packages are too. Log in with this run's
          # short-lived token into a throwaway docker config rather than writing a
          # long-lived credential to /root/.docker (and rather than clobbering the
          # one already there, which other stacks on this box may rely on).
          ssh production 'umask 077 && mkdir -p /tmp/stept-ghcr'
          ssh production "docker --config /tmp/stept-ghcr login ghcr.io -u ${{ github.actor }} --password-stdin" <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Pull, migrate, and start
        run: |
          ssh production 'set -eu
            cd /opt/stept
            docker compose config -q
            docker --config /tmp/stept-ghcr compose pull --quiet
            # Migrations run in a throwaway container before anything serves
            # traffic, so a failing migration fails the deploy instead of leaving
            # half the workers talking to a schema that moved.
            docker compose run --rm api migrate
            docker compose up -d --remove-orphans
            # compose does not restart caddy when only its bind-mounted config
            # changed; a graceful reload is free when nothing changed.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          '

      - name: Wait for health, and roll back if it never comes
        run: |
          ssh production 'set -eu
            cd /opt/stept
            for i in $(seq 1 40); do
              if [ "$(docker inspect -f "{{.State.Health.Status}}" stept-api-1 2>/dev/null)" = "healthy" ] \
                 && [ "$(docker inspect -f "{{.State.Health.Status}}" stept-caddy-1 2>/dev/null)" = "healthy" ]; then
                echo "healthy after ${i} checks"
                exit 0
              fi
              sleep 5
            done
            echo "::error::api/caddy did not become healthy" >&2
            docker compose ps
            docker compose logs --tail 80 api caddy
            exit 1
          '

      - name: Verify the live site end to end
        run: |
          APP="https://${{ secrets.DEPLOY_APP_DOMAIN }}"
          # Through the public edge, not from inside the box: this is what proves
          # DNS, TLS, ingress routing and the app are all working together.
          health=$(curl -fsS --max-time 20 "${APP}/api/v1/healthz")
          echo "healthz: ${health}"
          echo "${health}" | grep -q '"status":"ok"'
          echo "${health}" | grep -q '"database":"ok"'

          # The SPA must actually be served, not a proxy error page.
          curl -fsS --max-time 20 -o /dev/null -w 'spa: %{http_code}\n' "${APP}/"
          # The widget loader customer sites embed.
          curl -fsS --max-time 20 -o /dev/null -w 'loader: %{http_code}\n' "${APP}/widget-assets/loader.js"

          # The apex must serve the marketing site, not the app or an error.
          APEX="https://${{ secrets.DEPLOY_DOMAIN }}"
          curl -fsS --max-time 20 "${APEX}/" | grep -qi '<html'
          curl -fsS --max-time 20 -o /dev/null -w 'landing: %{http_code}\n' "${APEX}/"

          # Docs: soft check until the docs DNS record + first cert are
          # confirmed — a missing record must not roll back an app deploy.
          if curl -fsS --max-time 20 -o /dev/null "https://docs.${{ secrets.DEPLOY_DOMAIN }}/"; then
            echo "docs: ok"
          else
            echo "::warning::docs.${{ secrets.DEPLOY_DOMAIN }} is not serving yet (DNS/cert pending?)"
          fi

          # Hardening that must hold in production.
          docs=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${APP}/api/v1/docs")
          echo "docs (expect 404): ${docs}"
          [ "${docs}" = "404" ]

          headers=$(curl -sSI --max-time 20 "${APP}/api/v1/healthz")
          for header in strict-transport-security x-content-type-options x-frame-options referrer-policy; do
            echo "${headers}" | grep -iq "^${header}:" || { echo "missing ${header}"; exit 1; }
          done
          echo "security headers present"

      - name: Roll back to the previous images
        if: failure()
        run: |
          ssh production 'set -eu
            cd /opt/stept
            if [ ! -f .env.previous ]; then
              echo "no previous release recorded — leaving the stack as-is for inspection"
              exit 1
            fi
            echo "rolling back to:"
            grep -E "^(API|WEB)_IMAGE=" .env.previous
            cp .env.previous .env
            docker compose up -d --remove-orphans
          '
          echo "::error::deploy failed and was rolled back"

      - name: Mark this release as the rollback target
        if: success()
        run: |
          # Only a release that passed the live checks becomes the thing we roll
          # back to. Recorded last, so a failed deploy never overwrites a good one.
          ssh production 'cd /opt/stept && cp .env .env.previous && chmod 600 .env.previous'

      - name: Report
        if: always()
        run: |
          ssh production 'cd /opt/stept && docker compose ps' || true
          echo "api: ${{ needs.build.outputs.api_image }}"
          echo "web: ${{ needs.build.outputs.web_image }}"

      - name: Discard the throwaway registry credential
        if: always()
        run: ssh production 'rm -rf /tmp/stept-ghcr' || true
